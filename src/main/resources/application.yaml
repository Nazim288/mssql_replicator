spring:
  application:
    name: mssql-replication-service
    version: ${APP_VERSION:0.0.1}
    dpt: 9200
    dntdom: GPB
    user: test_user
    host: test_dns

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/meta_base?currentSchema=mssql_metadata}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:kampus}
    driverClassName: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: TargetDBPool

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        default_schema: mssql_metadata

  flyway:
    schemas: mssql_metadata
    enabled: true
    locations: classpath:db/migration
    url: ${DB_URL:jdbc:postgresql://localhost:5432/meta_base?currentSchema=mssql_metadata}
    user: ${DB_USER:postgres}
    password: ${DB_PASSWORD:kampus}

  tomcat:
    max-connections: 100 # Максимальное количество соединений
    accept-count: 100 # Максимальное количество потоков
    threads:
      max: 50 # Размер очереди запросов

  # vault config
  config:
    import: optional:vault://
  cloud:
    vault:
      uri: https://vault:8200
      authentication: APPROLE
      app-role:
        role-id: ${VAULT_ROLE_ID}
        secret-id: ${VAULT_SECRET_ID}
        app-role-path: ${VAULT_MOUNT_POINT}
      ssl:
        trust-store: file:/path/to/jks
        trust-store-password: ${VAULT_JKS_PASS}
        trust-store-type: JKS
        enabled: true
      kv:
        enabled: true
        backend: secret_v2_t
        default-context: path/to/secrets
        application-name: ""
      connection-timeout: 5000
      read-timeout: 15000

sources:
  connections:
    file-path: file:${CONFIG_DIR:classpath:db-connections.json}

logs-database:
  enabled: true
  task-create-partition: 0 0 0 * * ?
  url: ${DB_AUDIT_URL:jdbc:postgresql://localhost:5432/audit_db?currentSchema=audit}
  username: ${DB_AUDIT_USER:postgres}
  password: ${DB_AUDIT_PASSWORD:postgres}
  driverClassName: org.postgresql.Driver

clean-database-logs:
  # cron expression, to switch off put value '-'
  task-cleaner-schedule: 0 0 1 * * ?
  # delete logs from db that older than X years
  clean-period: 3

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
    endpoint:
      health:
        show-details: always
    metrics:
      export:
        prometheus:
          enabled: true

logging:
  level:
    root: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.engine.jdbc.connections.internal.DriverManagerConnectionProviderImpl: DEBUG
    org.apache.flink: INFO
    org.springframework.jdbc: WARN
    com.example.flinkreplication: DEBUG
  file:
    name: logs/mssql-replication.log
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    console: "%d{HH:mm:ss} %-5level %logger{36} - %msg%n"
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 7
